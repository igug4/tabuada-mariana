                    ${UI_ICONS.unlock}
                    <span>Desbloquear Tabuada do ${nextToUnlock}</span>
                  </button>
                ` : ''}
                <button onclick="navigate('tabuadas')" class="btn-3d btn-3d-blue text-white px-6 py-3 rounded-2xl font-display font-bold text-base">
                  Voltar para o Início
                </button>
              </div>
            </div>
          </div>
        `;
      }

      const card = state.cards.find(c => c.id === uiState.currentCardId);
      const mascot = MASCOTS[card.table - 1];
      const currentMood = uiState.phase === 'feedback' ? uiState.lastFeedback.rating : 'waiting';
      const mascotAnim = currentMood === 'good' ? 'animate-happy' : (currentMood === 'again' ? 'animate-shake' : 'animate-float');

      const bubbleStyles = {
        waiting: 'bg-sky-50 border-sky-200 text-sky-950',
        good: 'bg-emerald-50 border-emerald-300 text-emerald-950',
        hard: 'bg-amber-50 border-amber-300 text-amber-950',
        again: 'bg-rose-50 border-rose-200 text-rose-950'
      };

      const stateTagMap = {
        new: { label: 'Nova', cls: 'bg-sky-100 text-sky-700' },
        learning: { label: 'Aprendendo', cls: 'bg-rose-100 text-rose-700' },
        relearning: { label: 'Reforço', cls: 'bg-rose-100 text-rose-700' },
        review: { label: 'Revisão', cls: 'bg-emerald-100 text-emerald-700' }
      };
      const tagInfo = stateTagMap[card.state] || stateTagMap.new;

      let bottomSectionHtml = '';

      if (uiState.phase === 'asking') {
        const disabledClass = uiState.typedAnswer.length === 0 ? 'opacity-50' : '';
        bottomSectionHtml = `
          <!-- Teclado Numérico Grande e Colorido (otimizado para caber sem rolar no celular) -->
          <div class="mt-3 sm:mt-4 max-w-sm mx-auto">
            <div class="grid grid-cols-3 gap-2 sm:gap-2.5">
              ${[1,2,3,4,5,6,7,8,9].map(n => `
                <button type="button" onclick="handleDigitInput(${n})" class="btn-3d key-num h-[52px] sm:h-[60px] rounded-2xl font-display font-bold text-2xl sm:text-3xl text-slate-700 hover:bg-sky-50">
                  ${n}
                </button>
              `).join('')}

              <button type="button" onclick="handleBackspace()" aria-label="Apagar" class="btn-3d btn-3d-coral h-[52px] sm:h-[60px] rounded-2xl text-white font-display font-bold flex items-center justify-center">
                ${UI_ICONS.backspace}
              </button>

              <button type="button" onclick="handleDigitInput(0)" class="btn-3d key-num h-[52px] sm:h-[60px] rounded-2xl font-display font-bold text-2xl sm:text-3xl text-slate-700 hover:bg-sky-50">
                0
              </button>

              <button id="btn-submit-answer" type="button" onclick="submitCurrentAnswer()" ${uiState.typedAnswer.length === 0 ? 'disabled' : ''} class="btn-3d btn-3d-green h-[52px] sm:h-[60px] rounded-2xl text-white font-display font-bold text-lg flex items-center justify-center gap-1 ${disabledClass}">
                <span>OK</span>
              </button>
            </div>
            <p class="text-center text-[11px] font-bold text-slate-400 mt-2 hidden sm:block">
              Dica: no notebook, você também pode digitar os números e apertar Enter
            </p>
          </div>
        `;
      } else {
        const fb = uiState.lastFeedback;
        const secStr = (fb.elapsedMs / 1000).toFixed(1).replace('.', ',');

        if (fb.rating === 'good') {
          bottomSectionHtml = `
            <div class="mt-3.5 rounded-3xl bg-emerald-50 border-2 border-emerald-300 p-4 text-center animate-pop">
              <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-emerald-500 text-white font-display font-bold text-xs sm:text-sm shadow-sm">
                <span class="w-4 h-4 inline-flex text-amber-200">${UI_ICONS.star}</span>
                <span>BOM! +${fb.starsEarned} estrelinhas</span>
              </div>
              <h3 class="font-display font-bold text-lg sm:text-2xl text-emerald-900 mt-2">
                Arrasou, Mariana! Super rápido!
              </h3>
              <div class="mt-2 flex flex-wrap items-center justify-center gap-2 text-xs font-extrabold text-emerald-800">
                <span class="px-2.5 py-1 rounded-xl bg-white/85 border border-emerald-200 inline-flex items-center gap-1">
                  ${UI_ICONS.clock} Próxima revisão: ${fb.nextIntervalLabel}
                </span>
                <span class="px-2.5 py-1 rounded-xl bg-white/85 border border-emerald-200">
                  Tempo: ${secStr}s
                </span>
              </div>
              <button onclick="goToNextCard()" class="btn-3d btn-3d-green mt-3.5 w-full sm:w-auto min-w-[230px] py-3 px-6 rounded-2xl text-white font-display font-bold text-base sm:text-lg inline-flex items-center justify-center gap-2">
                <span>Próxima Conta</span>
                ${UI_ICONS.arrowRight}
              </button>
            </div>
          `;
        } else if (fb.rating === 'hard') {
          bottomSectionHtml = `
            <div class="mt-3.5 rounded-3xl bg-amber-50 border-2 border-amber-300 p-4 text-center animate-pop">
              <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-amber-400 text-amber-950 font-display font-bold text-xs sm:text-sm shadow-sm">
                <span class="w-4 h-4 inline-flex">${UI_ICONS.star}</span>
                <span>DIFÍCIL • +${fb.starsEarned} estrelinha</span>
              </div>
              <h3 class="font-display font-bold text-lg sm:text-2xl text-amber-950 mt-2">
                Acertou, Mariana! Logo fica bem rapidinho!
              </h3>
              <div class="mt-2 flex flex-wrap items-center justify-center gap-2 text-xs font-extrabold text-amber-900">
                <span class="px-2.5 py-1 rounded-xl bg-white/85 border border-amber-200 inline-flex items-center gap-1">
                  ${UI_ICONS.clock} Próxima revisão: ${fb.nextIntervalLabel}
                </span>
                <span class="px-2.5 py-1 rounded-xl bg-white/85 border border-amber-200">
                  Tempo: ${secStr}s
                </span>
              </div>
              <button onclick="goToNextCard()" class="btn-3d btn-3d-yellow mt-3.5 w-full sm:w-auto min-w-[230px] py-3 px-6 rounded-2xl text-amber-950 font-display font-bold text-base sm:text-lg inline-flex items-center justify-center gap-2">
                <span>Próxima Conta</span>
                ${UI_ICONS.arrowRight}
              </button>
            </div>
          `;
        } else {
          bottomSectionHtml = `
            <div class="mt-3.5 rounded-3xl bg-rose-50 border-2 border-rose-200 p-3.5 sm:p-4 text-center animate-pop">
              <div class="inline-flex items-center gap-1.5 px-3.5 py-1 rounded-full bg-rose-500 text-white font-display font-bold text-xs sm:text-sm shadow-sm">
                <span>NOVAMENTE • Vamos reforçar!</span>
              </div>

              <div class="mt-2 text-xs sm:text-sm font-bold text-rose-800">
                Você colocou <span class="line-through opacity-75">${fb.userNumber}</span>, mas o certinho é:
              </div>
              <div class="mt-1 inline-block px-4 py-1.5 rounded-2xl bg-white border-2 border-rose-200 font-display font-bold text-2xl sm:text-3xl text-rose-600 shadow-sm">
                ${fb.table} × ${fb.multiplier} = ${fb.correctAnswer}
              </div>

              <!-- Dica mental específica para esta multiplicação -->
              <div class="mt-2.5 text-left bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 flex items-start gap-2 max-w-md mx-auto">
                <span class="shrink-0 w-7 h-7 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center mt-0.5">
                  ${UI_ICONS.bulb}
                </span>
                <p class="text-xs sm:text-sm font-bold text-amber-950 leading-snug">
                  ${fb.hint}
                </p>
              </div>

              <div class="mt-2 flex items-center justify-center text-[11px] font-extrabold text-rose-700">
                <span class="px-2.5 py-1 rounded-xl bg-white/80 border border-rose-200 inline-flex items-center gap-1">
                  ${UI_ICONS.clock} Volta em: ${fb.nextIntervalLabel}
                </span>
              </div>

              <button onclick="goToNextCard()" class="btn-3d btn-3d-blue mt-3 w-full sm:w-auto min-w-[230px] py-3 px-6 rounded-2xl text-white font-display font-bold text-base sm:text-lg inline-flex items-center justify-center gap-2">
                <span>Entendi! Próxima Conta</span>
                ${UI_ICONS.arrowRight}
              </button>
            </div>
          `;
        }
      }

      return `
        <div class="max-w-lg mx-auto">
          <!-- Barra superior enxuta de estudo com contadores Azul/Vermelho/Verde -->
          <div class="flex items-center justify-between gap-2 mb-2.5">
            <button onclick="navigate('tabuadas')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-2xl bg-white border-2 border-slate-200 font-display font-bold text-xs sm:text-sm text-slate-600 hover:bg-slate-50 shadow-sm">
              ${UI_ICONS.back}
              <span>Tabuadas</span>
            </button>

            <div class="flex items-center gap-1 bg-white px-2.5 py-1 rounded-2xl border-2 border-slate-200 shadow-sm text-[11px] sm:text-xs font-display font-bold">
              <span class="px-2 py-0.5 rounded-lg bg-sky-100 text-sky-700">${counts.newCount} novos</span>
              <span class="px-2 py-0.5 rounded-lg bg-rose-100 text-rose-600">${counts.learningCount} aprend.</span>
              <span class="px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-700">${counts.reviewCount} rev.</span>
            </div>
          </div>

          <!-- Cartão de Jogo -->
          <div class="bg-white rounded-[1.75rem] border-4 border-sky-100 shadow-xl p-3.5 sm:p-5">
            <!-- Mascote + Balão de Fala para a Mariana -->
            <div class="flex items-center gap-2.5 sm:gap-3.5 mb-3">
              <div class="shrink-0 w-16 h-16 sm:w-20 sm:h-20 rounded-2xl ${mascot.bgSoft} border-2 ${mascot.borderSoft} flex items-center justify-center p-1 ${mascotAnim}">
                ${renderMascotSVG(card.table, currentMood, 'w-full h-full')}
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex flex-wrap items-center gap-1 mb-1">
                  <span class="font-display font-bold text-xs sm:text-sm text-slate-700">${mascot.name}</span>
                  <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg ${mascot.badgeBg}">Do ${card.table}</span>
                  <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg ${tagInfo.cls}">${tagInfo.label}</span>
                </div>
                <div class="rounded-2xl border-2 px-3 py-1.5 sm:py-2 text-xs sm:text-sm font-bold leading-snug ${bubbleStyles[currentMood]}">
                  ${uiState.mascotPhrase}
                </div>
              </div>
            </div>

            <!-- Conta Matemática Grande -->
            <div class="rounded-2xl bg-gradient-to-b from-sky-50/90 to-white border-2 border-sky-100 py-3.5 sm:py-5 px-3 text-center">
              <div class="flex items-center justify-center gap-2.5 sm:gap-4 flex-wrap">
                <span class="font-display font-bold text-4xl sm:text-6xl text-slate-800 tracking-wide">
                  ${card.table} <span class="text-pink-500">×</span> ${card.multiplier} <span class="text-slate-400">=</span>
                </span>
                <div id="study-answer-box" class="min-w-[88px] sm:min-w-[116px] h-[56px] sm:h-[72px] px-3 rounded-2xl bg-white border-4 ${uiState.phase === 'feedback' ? (uiState.lastFeedback.isCorrect ? 'border-emerald-400 text-emerald-600' : 'border-rose-400 text-rose-500') : 'border-sky-300 text-sky-600'} shadow-inner flex items-center justify-center font-display font-bold text-4xl sm:text-5xl">
                  ${uiState.typedAnswer === '' ? '<span class="text-slate-300">?</span>' : uiState.typedAnswer}
                </div>
              </div>
            </div>

            ${bottomSectionHtml}
          </div>
        </div>
      `;
    }

    /*************************************************************************
     * 15. ABA 3: ÁLBUM & MAPA (ÁLBUM DOS 10 BICHINHOS + MAPA DE CALOR 10×10)
     *************************************************************************/
    function selectMapCard(cardId) {
      SoundFX.tap();
      uiState.selectedMapCardId = cardId;
      renderApp();
    }

    function renderAlbumMapView() {
      const unlockedCount = state.unlockedTables.length;
      const goldCount = MASCOTS.filter(m => getTableMastery(m.table).medal.stars === 4).length;

      // Parte A: Álbum dos 10 Bichinhos
      const albumCardsHtml = MASCOTS.map(m => {
        const mastery = getTableMastery(m.table);
        const starsHtml = [1, 2, 3, 4].map(i => `
          <span class="w-3.5 h-3.5 inline-flex ${i <= mastery.medal.stars ? 'text-amber-400' : 'text-slate-200'}">
            ${UI_ICONS.star}
          </span>
        `).join('');

        return `
          <div class="bg-white rounded-3xl border-2 ${mastery.isUnlocked ? m.borderSoft : 'border-slate-200'} p-3.5 shadow-sm flex flex-col items-center text-center">
            <div class="w-full flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-display font-bold px-2 py-0.5 rounded-xl ${mastery.isUnlocked ? m.badgeBg : 'bg-slate-100 text-slate-400'}">
                Do ${m.table}
              </span>
              <div class="flex items-center gap-0.5">${starsHtml}</div>
            </div>

            <div class="w-24 h-24 rounded-2xl ${mastery.isUnlocked ? m.bgSoft : 'bg-slate-100'} border ${mastery.isUnlocked ? m.borderSoft : 'border-slate-200'} flex items-center justify-center p-1.5 my-1 ${!mastery.isUnlocked ? 'grayscale opacity-45' : ''}">
              ${renderMascotSVG(m.table, mastery.medal.stars >= 3 ? 'good' : 'waiting', 'w-20 h-20')}
            </div>

            <h3 class="font-display font-bold text-lg text-slate-800 leading-tight mt-1">${m.name}</h3>
            <div class="text-[11px] font-bold text-slate-400">${m.species}</div>

            <div class="mt-2 px-2.5 py-0.5 rounded-full text-[11px] font-display font-bold ${mastery.medal.color}">
              ${mastery.medal.label}
            </div>

            <div class="w-full mt-2.5 pt-2 border-t border-slate-100 grid grid-cols-2 gap-1.5 text-[11px]">
              <div class="bg-slate-50 rounded-xl p-1">
                <div class="font-display font-bold text-slate-700">${mastery.graduated}/10</div>
                <div class="text-[10px] font-bold text-slate-400">Firmes</div>
              </div>
              <div class="bg-slate-50 rounded-xl p-1">
                <div class="font-display font-bold text-slate-700">${mastery.avgSpeedSec ? mastery.avgSpeedSec.toFixed(1).replace('.', ',') + 's' : '—'}</div>
                <div class="text-[10px] font-bold text-slate-400">Média</div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Parte B: Mapa de Calor 10x10
      let countMastered = 0, countSlow = 0, countHelp = 0, countNew = 0;
      state.cards.forEach(c => {
        const s = getCardHeatStatus(c).key;
        if (s === 'mastered') countMastered++;
        else if (s === 'slow') countSlow++;
        else if (s === 'needs_help') countHelp++;
        else countNew++;
      });

      let gridHtml = `<div class="grid grid-cols-11 gap-1 sm:gap-1.5 min-w-[290px]">`;
      gridHtml += `<div class="aspect-square rounded-lg sm:rounded-xl bg-pink-500 text-white font-display font-bold text-xs sm:text-base flex items-center justify-center">×</div>`;
      for (let col = 1; col <= 10; col++) {
        gridHtml += `<div class="aspect-square rounded-lg sm:rounded-xl bg-sky-100 text-sky-800 font-display font-bold text-xs sm:text-sm flex items-center justify-center">${col}</div>`;
      }

      for (let row = 1; row <= 10; row++) {
        gridHtml += `<div class="aspect-square rounded-lg sm:rounded-xl bg-sky-100 text-sky-800 font-display font-bold text-xs sm:text-sm flex items-center justify-center">${row}</div>`;
        for (let col = 1; col <= 10; col++) {
          const card = state.cards.find(c => c.table === row && c.multiplier === col);
          const heat = getCardHeatStatus(card);
          const isSelected = uiState.selectedMapCardId === card.id;
          gridHtml += `
            <button onclick="selectMapCard('${card.id}')" title="${row} × ${col} = ${card.answer} (${heat.label})"
              class="aspect-square rounded-lg sm:rounded-xl border-2 font-display font-bold text-[11px] sm:text-sm flex items-center justify-center transition-transform hover:scale-105 ${heat.cellClass} ${isSelected ? 'ring-4 ring-pink-400 scale-105 z-10' : ''}">
              ${card.answer}
            </button>
          `;
        }
      }
      gridHtml += `</div>`;

      const selectedCard = state.cards.find(c => c.id === uiState.selectedMapCardId) || state.cards[0];
      const selHeat = getCardHeatStatus(selectedCard);
      const selMascot = MASCOTS[selectedCard.table - 1];
      const stateNames = {
        new: 'Nova',
        learning: 'Aprendendo',
        relearning: 'Em Reforço',
        review: 'Graduada (Revisão)'
      };

      let nextDueStr = 'Ainda não agendada';
      if (selectedCard.state === 'learning' || selectedCard.state === 'relearning') {
        const diffMs = selectedCard.dueTimestamp - Date.now();
        nextDueStr = diffMs <= 0 ? 'Pronta agora!' : `Em ${formatIntervalLabel(diffMs, false)}`;
      } else if (selectedCard.state === 'review') {
        const diffDays = Math.ceil((selectedCard.dueTimestamp - getStartOfTodayMs()) / 86400000);
        nextDueStr = diffDays <= 0 ? 'Hoje!' : `Em ${formatIntervalLabel(diffDays, true)}`;
      }

      return `
        <!-- Seção 1: Álbum dos Bichinhos da Mariana -->
        <section class="mb-8">
          <div class="mb-4 bg-white rounded-3xl border-2 border-pink-200 p-5 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h1 class="font-display font-bold text-2xl sm:text-3xl text-slate-800">Álbum dos Bichinhos da Mariana</h1>
              <p class="text-sm font-bold text-slate-500 mt-0.5">
                Cada tabuada que a Mariana domina desbloqueia medalhas de Bronze, Prata e Ouro!
              </p>
            </div>
            <div class="flex items-center gap-2.5 shrink-0">
              <div class="px-4 py-2 rounded-2xl bg-pink-50 border-2 border-pink-200 text-center">
                <div class="font-display font-bold text-xl text-pink-600">${unlockedCount}/10</div>
                <div class="text-[11px] font-extrabold text-pink-500">Na Turma</div>
              </div>
              <div class="px-4 py-2 rounded-2xl bg-amber-50 border-2 border-amber-200 text-center">
                <div class="font-display font-bold text-xl text-amber-600">${goldCount}/10</div>
                <div class="text-[11px] font-extrabold text-amber-600">Ouro</div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
            ${albumCardsHtml}
          </div>
        </section>

        <!-- Seção 2: Mapa de Calor 10x10 Interativo -->
        <section>
          <div class="mb-4 bg-white rounded-3xl border-2 border-sky-100 p-5 shadow-sm">
            <h2 class="font-display font-bold text-2xl text-slate-800">Mapa de Calor 10×10 da Mariana</h2>
            <p class="text-sm font-bold text-slate-500 mt-1">
              Toque em qualquer quadradinho para ver a dica e o progresso. Vamos deixar o tabuleiro todo verdinho!
            </p>
            <div class="mt-3.5 flex flex-wrap gap-2 text-xs font-extrabold">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-slate-100 text-slate-600 border border-slate-200">
                <span class="w-3 h-3 rounded-full bg-slate-300"></span> Nova (${countNew})
              </span>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-rose-50 text-rose-700 border border-rose-200">
                <span class="w-3 h-3 rounded-full bg-rose-400"></span> Errando / Reforço (${countHelp})
              </span>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-amber-50 text-amber-800 border border-amber-200">
                <span class="w-3 h-3 rounded-full bg-amber-400"></span> Devagar / Difícil (${countSlow})
              </span>
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl bg-emerald-50 text-emerald-800 border border-emerald-200">
                <span class="w-3 h-3 rounded-full bg-emerald-400"></span> Dominada / Rápida (${countMastered})
              </span>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
            <div class="lg:col-span-7 bg-white rounded-3xl border-2 border-sky-100 p-3 sm:p-5 shadow-sm">
              ${gridHtml}
            </div>

            <div class="lg:col-span-5 bg-white rounded-3xl border-2 border-sky-200 p-5 shadow-sm">
              <div class="flex items-center gap-3 pb-4 border-b border-slate-100">
                <div class="w-16 h-16 rounded-2xl ${selMascot.bgSoft} border ${selMascot.borderSoft} flex items-center justify-center p-1 shrink-0">
                  ${renderMascotSVG(selectedCard.table, selHeat.key === 'mastered' ? 'good' : (selHeat.key === 'needs_help' ? 'again' : 'waiting'), 'w-full h-full')}
                </div>
                <div>
                  <div class="font-display font-bold text-3xl text-slate-800 leading-none">
                    ${selectedCard.table} × ${selectedCard.multiplier} = <span class="text-pink-600">${selectedCard.answer}</span>
                  </div>
                  <div class="mt-1.5 inline-flex items-center gap-1.5 text-xs font-extrabold px-2.5 py-0.5 rounded-lg ${selHeat.cellClass} border">
                    ${selHeat.label}
                  </div>
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2.5 my-4 text-xs">
                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100">
                  <div class="text-slate-400 font-bold">Estado no Anki</div>
                  <div class="font-display font-bold text-sm text-slate-800 mt-0.5">${stateNames[selectedCard.state]}</div>
                </div>
                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100">
                  <div class="text-slate-400 font-bold">Próxima Revisão</div>
                  <div class="font-display font-bold text-sm text-slate-800 mt-0.5">${nextDueStr}</div>
                </div>
                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100">
                  <div class="text-slate-400 font-bold">Intervalo / Facilidade</div>
                  <div class="font-display font-bold text-sm text-slate-800 mt-0.5">
                    ${selectedCard.intervalDays > 0 ? formatIntervalLabel(selectedCard.intervalDays, true) : '—'} • ${selectedCard.ease.toFixed(2)}
                  </div>
                </div>
                <div class="bg-slate-50 rounded-2xl p-3 border border-slate-100">
                  <div class="text-slate-400 font-bold">Tempo Médio</div>
                  <div class="font-display font-bold text-sm text-slate-800 mt-0.5">
                    ${selectedCard.avgTimeMs > 0 ? (selectedCard.avgTimeMs / 1000).toFixed(1).replace('.', ',') + 's' : 'Sem dados'}
                  </div>
                </div>
                <div class="bg-emerald-50 rounded-2xl p-3 border border-emerald-100">
                  <div class="text-emerald-600 font-bold">Acertos</div>
                  <div class="font-display font-bold text-lg text-emerald-700 leading-tight">${selectedCard.totalCorrect}</div>
                </div>
                <div class="bg-rose-50 rounded-2xl p-3 border border-rose-100">
                  <div class="text-rose-600 font-bold">Erros</div>
                  <div class="font-display font-bold text-lg text-rose-700 leading-tight">${selectedCard.totalWrong}</div>
                </div>
              </div>

              <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3.5 flex items-start gap-2.5">
                <span class="shrink-0 w-7 h-7 rounded-xl bg-amber-200 text-amber-800 flex items-center justify-center">
                  ${UI_ICONS.bulb}
                </span>
                <div class="text-xs font-bold text-amber-950 leading-relaxed">
                  ${getMentalHint(selectedCard.table, selectedCard.multiplier)}
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    /*************************************************************************
     * 16. ABA 4: OPÇÕES (PAIS) — ANKI SM-2 + SINCRONIZAÇÃO NA NUVEM + BACKUP
     *************************************************************************/
    const GOOGLE_APPS_SCRIPT_SNIPPET = `function doGet() {
  var fileName = 'tabuada-da-mariana-progresso.json';
  var files = DriveApp.getFilesByName(fileName);
  var content = '{}';
  if (files.hasNext()) {
    content = files.next().getBlob().getDataAsString('UTF-8');
  }
  return ContentService.createTextOutput(content)
    .setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var fileName = 'tabuada-da-mariana-progresso.json';
  var data = e.postData ? e.postData.contents : '{}';
  var files = DriveApp.getFilesByName(fileName);
  if (files.hasNext()) {
    files.next().setContent(data);
  } else {
    DriveApp.createFile(fileName, data, MimeType.PLAIN_TEXT);
  }
  return ContentService.createTextOutput(JSON.stringify({ ok: true }))
    .setMimeType(ContentService.MimeType.JSON);
}`;

    function saveCloudUrlFromOptions() {
      const input = document.getElementById('cfg-cloudUrl');
      if (!input) return;
      const val = input.value.trim();
      try {
        if (val) {
          localStorage.setItem(CLOUD_URL_STORAGE_KEY, val);
          showToast('URL da nuvem salva! Sincronizando agora...', 'info');
          syncNow(true);
        } else {
          localStorage.removeItem(CLOUD_URL_STORAGE_KEY);
          uiState.syncStatus = fbSync.ready ? 'synced' : 'local';
          updateSyncBadgeUI();
          showToast('URL removida. Salvando apenas neste aparelho.', 'info');
        }
      } catch (e) {
        showToast('Erro ao salvar a URL neste navegador.', 'error');
      }
    }

    function saveOptionsForm(e) {
      e.preventDefault();
      const getNum = (id, fallback, min = 0) => {
        const v = parseFloat(document.getElementById(id).value);
        return isNaN(v) ? fallback : Math.max(min, v);
      };
      const stepsVal = document.getElementById('cfg-etapasAprendizagem').value.trim() || '1m 10m';

      state.config = {
        novosPorDia: Math.round(getNum('cfg-novosPorDia', 9999, 1)),
        revisoesPorDia: Math.round(getNum('cfg-revisoesPorDia', 9999, 1)),
        etapasAprendizagem: stepsVal,
        etapaReaprendizagemMin: getNum('cfg-etapaReaprendizagemMin', 10, 1),
        intervaloGraduacao: Math.round(getNum('cfg-intervaloGraduacao', 1, 1)),
        intervaloMaximo: Math.round(getNum('cfg-intervaloMaximo', 36500, 1)),
        facilidadeInicial: Number(getNum('cfg-facilidadeInicial', 2.50, 1.30).toFixed(2)),
        modificadorIntervalo: Number(getNum('cfg-modificadorIntervalo', 1.00, 0.10).toFixed(2)),
        intervaloArduo: Number(getNum('cfg-intervaloArduo', 1.20, 1.00).toFixed(2)),
        novoIntervaloLapso: Number(Math.min(1.0, getNum('cfg-novoIntervaloLapso', 0.50, 0.00)).toFixed(2)),
        limiteBomSegundos: Number(getNum('cfg-limiteBomSegundos', 5.0, 1.0).toFixed(1)),
        learnAheadMin: Math.round(getNum('cfg-learnAheadMin', 20, 0))
      };

      saveStateAndSync();
      SoundFX.good();
      showToast('Parâmetros do Anki salvos com sucesso!', 'success');
      renderApp();
    }

    function restoreDefaultAnkiOptions() {
      state.config = { ...DEFAULT_CONFIG };
      saveStateAndSync();
      SoundFX.tap();
      showToast('Padrões (9999 / 1m 10m / 0.50) restaurados!', 'info');
      renderApp();
    }

    function exportBackupJSON() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tabuada-da-mariana-backup-${getTodayDateStr()}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        SoundFX.good();
        showToast('Backup JSON exportado!', 'success');
      } catch (err) {
        showToast('Não foi possível exportar o backup.', 'error');
      }
    }

    function triggerImportBackup() {
      document.getElementById('import-file-input').click();
    }

    document.getElementById('import-file-input').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!parsed || !Array.isArray(parsed.cards) || parsed.cards.length < 10) {
            throw new Error('Formato inválido');
          }
          state = normalizeState(parsed);
          saveStateAndSync();
          SoundFX.unlock();
          showToast('Backup importado e sincronizado!', 'success');
          renderApp();
        } catch (err) {
          showToast('Arquivo inválido. Escolha um JSON da Tabuada da Mariana.', 'error');
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    });

    function askResetProgress() {
      showModal({
        title: 'Zerar progresso da Mariana?',
        iconSvg: UI_ICONS.trash,
        iconBg: 'bg-rose-100 text-rose-600',
        bodyHtml: `
          <p>Isso vai zerar as revisões, estrelas, ofensiva de dias e deixar apenas a <strong>Tabuada do 1</strong> desbloqueada.</p>
          <p class="mt-2 text-xs font-bold text-slate-500">Se quiser guardar uma cópia antes, clique em "Exportar JSON".</p>
        `,
        actions: [
          {
            label: 'Cancelar',
            className: 'btn-3d btn-3d-white text-slate-700 px-5 py-2.5 rounded-2xl font-display font-bold text-sm'
          },
          {
            label: 'Sim, zerar tudo',
            className: 'btn-3d btn-3d-coral text-white px-5 py-2.5 rounded-2xl font-display font-bold text-sm',
            onClick: () => {
              state = createInitialState();
              saveStateAndSync();
              SoundFX.tap();
              showToast('Progresso zerado!', 'info');
              renderApp();
            }
          }
        ]
      });
    }

    function renderOptionsView() {
      const c = state.config;
      const effectiveUrl = getEffectiveCloudUrl();
      const isHardcoded = Boolean((CLOUD_SYNC_URL || '').trim());
      const inputCls = 'w-full mt-1 px-3.5 py-2.5 rounded-xl bg-slate-50 border-2 border-slate-200 focus:border-sky-400 focus:bg-white focus:outline-none font-display font-bold text-slate-800 text-sm';

      return `
        <div class="max-w-3xl mx-auto space-y-5">
          <!-- Cabeçalho -->
          <div class="bg-white rounded-3xl border-2 border-sky-100 p-5 shadow-sm">
            <h1 class="font-display font-bold text-2xl sm:text-3xl text-slate-800">Opções (Pais)</h1>
            <p class="text-sm font-bold text-slate-500 mt-1">
              Ajuste os parâmetros clonados do Anki, gerencie as tabuadas liberadas e configure a sincronização na nuvem para a Mariana usar em qualquer celular ou notebook.
            </p>
          </div>

          <!-- SEÇÃO DE SINCRONIZAÇÃO NA NUVEM (GOOGLE DRIVE / APPS SCRIPT) -->
          <div class="bg-white rounded-3xl border-2 border-emerald-200 p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100 mb-4">
              <div class="flex items-center gap-2.5">
                <span class="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center">
                  ${UI_ICONS.cloud}
                </span>
                <div>
                  <h2 class="font-display font-bold text-lg text-slate-800 leading-tight">Sincronização na Nuvem (Google Drive)</h2>
                  <p class="text-xs font-bold text-slate-500">
                    Última sincronização: <span id="opt-last-sync-time" class="text-emerald-700">${formatLastSyncTime()}</span>
                  </p>
                </div>
              </div>
              <button type="button" onclick="syncNow(true)" class="btn-3d btn-3d-green text-white px-4 py-2 rounded-2xl font-display font-bold text-xs sm:text-sm inline-flex items-center gap-1.5">
                ${UI_ICONS.sync}
                <span>Sincronizar Agora</span>
              </button>
            </div>

            <div class="space-y-3">
              <label class="block">
                <span class="text-xs font-extrabold text-slate-600">URL do Google Apps Script Web App (salva no seu Google Drive)</span>
                <div class="mt-1 flex flex-col sm:flex-row gap-2">
                  <input id="cfg-cloudUrl" type="url" value="${effectiveUrl}" ${isHardcoded ? 'readonly' : ''} placeholder="https://script.google.com/macros/s/.../exec" class="${inputCls} mt-0 flex-1 ${isHardcoded ? 'opacity-80' : ''}" />
                  ${!isHardcoded ? `
                    <button type="button" onclick="saveCloudUrlFromOptions()" class="btn-3d btn-3d-blue text-white px-5 py-2.5 rounded-xl font-display font-bold text-sm shrink-0">
                      Salvar URL
                    </button>
                  ` : ''}
                </div>
                <span class="text-[11px] font-bold text-slate-400 mt-1 block">
                  ${isHardcoded
                    ? 'URL fixada diretamente na constante CLOUD_SYNC_URL do arquivo HTML — funciona automaticamente em todos os celulares!'
                    : 'Dica: se colar essa URL também na constante CLOUD_SYNC_URL no código HTML, qualquer celular já abre sincronizado sem precisar colar aqui.'}
                </span>
              </label>

              <!-- Passo a passo rápido + código do Google Apps Script -->
              <details class="rounded-2xl bg-slate-50 border border-slate-200 p-3.5 text-xs">
                <summary class="font-display font-bold text-slate-700 cursor-pointer select-none">
                  Ver código pronto do Google Apps Script (para salvar no seu Google Drive)
                </summary>
                <p class="text-slate-600 font-semibold mt-2 leading-relaxed">
                  1. Acesse <strong>script.google.com</strong> logado na sua conta Google e crie um Novo Projeto.<br/>
                  2. Cole o código abaixo, clique em <strong>Implantar → Nova implantação → App da Web</strong>.<br/>
                  3. Em <em>Quem pode acessar</em> escolha <strong>Qualquer pessoa</strong>, clique em Implantar e copie a URL gerada.
                </p>
                <div class="relative mt-2.5">
                  <pre class="bg-slate-800 text-emerald-300 p-3 rounded-xl overflow-x-auto text-[11px] leading-relaxed font-mono">${GOOGLE_APPS_SCRIPT_SNIPPET.replace(/</g, '&lt;')}</pre>
                  <button type="button" onclick="copyTextFallback(GOOGLE_APPS_SCRIPT_SNIPPET)" class="mt-2 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-sky-100 hover:bg-sky-200 text-sky-800 font-display font-bold text-xs">
                    ${UI_ICONS.copy}
                    <span>Copiar Código do Apps Script</span>
                  </button>
                </div>
              </details>
            </div>
          </div>

          <!-- PARÂMETROS CLONADOS DO ANKI -->
          <form onsubmit="saveOptionsForm(event)" class="space-y-5">
            <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 shadow-sm">
              <h2 class="font-display font-bold text-lg text-slate-800 pb-2 border-b border-slate-100 mb-4">Limites Diários & Aprendizagem</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Novos cartões/dia</span>
                  <input id="cfg-novosPorDia" type="number" min="1" max="99999" value="${c.novosPorDia}" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Revisões máximas/dia</span>
                  <input id="cfg-revisoesPorDia" type="number" min="1" max="99999" value="${c.revisoesPorDia}" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Etapas de aprendizagem</span>
                  <input id="cfg-etapasAprendizagem" type="text" value="${c.etapasAprendizagem}" placeholder="1m 10m" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Reaprendizagem no lapso (min)</span>
                  <input id="cfg-etapaReaprendizagemMin" type="number" min="1" value="${c.etapaReaprendizagemMin}" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Intervalo de graduação (dias)</span>
                  <input id="cfg-intervaloGraduacao" type="number" min="1" value="${c.intervaloGraduacao}" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Learn Ahead — adiantamento (min)</span>
                  <input id="cfg-learnAheadMin" type="number" min="0" value="${c.learnAheadMin}" class="${inputCls}" />
                </label>
                <label class="block sm:col-span-2 bg-sky-50 border-2 border-sky-200 rounded-2xl p-3.5">
                  <span class="text-xs font-extrabold text-sky-800">Cronômetro oculto — tempo limite para "Bom" (segundos)</span>
                  <input id="cfg-limiteBomSegundos" type="number" min="1" max="30" step="0.5" value="${c.limiteBomSegundos}" class="${inputCls} bg-white" />
                  <span class="text-[11px] font-bold text-sky-700 mt-1 block">
                    Até ${c.limiteBomSegundos}s = <strong>Bom</strong> • Acima de ${c.limiteBomSegundos}s = <strong>Difícil</strong> • Errou = <strong>Novamente</strong> (sem botão Fácil).
                  </span>
                </label>
              </div>
            </div>

            <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 shadow-sm">
              <h2 class="font-display font-bold text-lg text-slate-800 pb-2 border-b border-slate-100 mb-4">Avançado (SM-2)</h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Intervalo máximo (dias)</span>
                  <input id="cfg-intervaloMaximo" type="number" min="1" value="${c.intervaloMaximo}" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Facilidade inicial</span>
                  <input id="cfg-facilidadeInicial" type="number" min="1.30" step="0.05" value="${c.facilidadeInicial.toFixed(2)}" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Modificador de intervalo</span>
                  <input id="cfg-modificadorIntervalo" type="number" min="0.10" step="0.05" value="${c.modificadorIntervalo.toFixed(2)}" class="${inputCls}" />
                </label>
                <label class="block">
                  <span class="text-xs font-extrabold text-slate-600">Intervalo árduo (Difícil)</span>
                  <input id="cfg-intervaloArduo" type="number" min="1.00" step="0.05" value="${c.intervaloArduo.toFixed(2)}" class="${inputCls}" />
                </label>
                <label class="block sm:col-span-2 bg-amber-50 border-2 border-amber-200 rounded-2xl p-3">
                  <span class="text-xs font-extrabold text-amber-900">Novo intervalo (ao errar revisão / lapso)</span>
                  <input id="cfg-novoIntervaloLapso" type="number" min="0.00" max="1.00" step="0.05" value="${c.novoIntervaloLapso.toFixed(2)}" class="${inputCls} bg-white" />
                  <span class="text-[11px] font-bold text-amber-800 mt-1 block">Em 0.50: mantém 50% do intervalo anterior (mín. 1 dia) e reduz facilidade em 0.20 (piso 1.30).</span>
                </label>
              </div>
            </div>

            <div class="flex flex-wrap gap-3 justify-end">
              <button type="button" onclick="restoreDefaultAnkiOptions()" class="btn-3d btn-3d-white text-slate-700 px-5 py-2.5 rounded-2xl font-display font-bold text-sm">
                Restaurar Padrões
              </button>
              <button type="submit" class="btn-3d btn-3d-green text-white px-7 py-2.5 rounded-2xl font-display font-bold text-base">
                Salvar Opções
              </button>
            </div>
          </form>

          <!-- GERENCIAR TABUADAS -->
          <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100 mb-4">
              <div>
                <h2 class="font-display font-bold text-lg text-slate-800">Tabuadas Liberadas</h2>
                <p class="text-xs font-bold text-slate-500">Toque para liberar ou bloquear qualquer tabuada.</p>
              </div>
              <button type="button" onclick="unlockAllTables()" class="px-3.5 py-2 rounded-xl bg-violet-100 hover:bg-violet-200 text-violet-800 font-display font-bold text-xs">
                Desbloquear Todas (1 a 10)
              </button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2">
              ${MASCOTS.map(m => {
                const isOpen = state.unlockedTables.includes(m.table);
                return `
                  <button type="button" onclick="toggleTableLockFromOptions(${m.table})"
                    class="p-2.5 rounded-2xl border-2 font-display font-bold text-sm flex items-center justify-between transition-all ${isOpen ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-slate-50 border-slate-200 text-slate-400'}">
                    <span>Do ${m.table}</span>
                    <span class="inline-flex">${isOpen ? UI_ICONS.unlock : UI_ICONS.lock}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- BACKUP JSON E REINÍCIO -->
          <div class="bg-white rounded-3xl border-2 border-slate-200 p-5 shadow-sm">
            <h2 class="font-display font-bold text-lg text-slate-800 pb-2 border-b border-slate-100 mb-4">Backup Manual & Reinício</h2>
            <div class="flex flex-wrap gap-3">
              <button type="button" onclick="exportBackupJSON()" class="btn-3d btn-3d-blue text-white px-4 py-2.5 rounded-2xl font-display font-bold text-sm inline-flex items-center gap-2">
                ${UI_ICONS.download}
                <span>Exportar JSON</span>
              </button>
              <button type="button" onclick="triggerImportBackup()" class="btn-3d btn-3d-lilac text-white px-4 py-2.5 rounded-2xl font-display font-bold text-sm inline-flex items-center gap-2">
                ${UI_ICONS.upload}
                <span>Importar JSON</span>
              </button>
              <button type="button" onclick="askResetProgress()" class="btn-3d btn-3d-coral text-white px-4 py-2.5 rounded-2xl font-display font-bold text-sm inline-flex items-center gap-2 sm:ml-auto">
                ${UI_ICONS.trash}
                <span>Resetar Progresso</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /*************************************************************************
     * 17. INICIALIZAÇÃO DO APLICATIVO
     *************************************************************************/
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      renderApp();

      // Inicializa sincronização silenciosa (Google Apps Script e/ou Firebase se disponível)
      initSilentFirebase();
      if (getEffectiveCloudUrl()) {
        syncNow(false);
      }
    });
  </script>
</body>
</html>
